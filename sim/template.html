<meta charset="utf-8">
<title>jvs 測試台</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* 版面：左邊頻道聊天，右邊工具欄（手機改成上方分頁）；時間快轉固定在頂列 */
:root {
  --bg: #eef0f4; --surface: #ffffff; --surface-2: #f6f7fa; --fg: #1a1f2c; --muted: #5f6b80; --line: #dde1e9;
  --accent: #c76a12; --accent-soft: #fbe9d6; --accent-ink: #ffffff;
  --bot: #3d55c9; --mention: #e3e8fb; --mention-fg: #2c43b3;
  --ok: #23845a; --ok-soft: #dcf2e7; --danger: #c93c3c; --danger-soft: #fbe2e2;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12151c; --surface: #1a1e28; --surface-2: #212634; --fg: #e8eaf0; --muted: #9aa3b6; --line: #2b3142;
  --accent: #f29a45; --accent-soft: #3a2a1a; --accent-ink: #1a1206;
  --bot: #93a5ff; --mention: #28305a; --mention-fg: #b9c5ff;
  --ok: #4cc28a; --ok-soft: #173327; --danger: #ff7a7a; --danger-soft: #3a1d1f; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #12151c; --surface: #1a1e28; --surface-2: #212634; --fg: #e8eaf0; --muted: #9aa3b6; --line: #2b3142;
  --accent: #f29a45; --accent-soft: #3a2a1a; --accent-ink: #1a1206;
  --bot: #93a5ff; --mention: #28305a; --mention-fg: #b9c5ff;
  --ok: #4cc28a; --ok-soft: #173327; --danger: #ff7a7a; --danger-soft: #3a1d1f; color-scheme: dark }

html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font: 15px/1.55 var(--font-body); }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input, select, textarea { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 6px 9px; }
textarea { resize: vertical; width: 100%; }
code { font-family: var(--font-mono); font-size: 12px; }

.app { height: 100%; display: grid; grid-template-rows: auto 1fr; grid-template-columns: minmax(0, 1fr); }
.top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { font-weight: 700; }
.brand span { color: var(--muted); font-weight: 500; }
.timebar { margin-left: auto; display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.clock { font-family: var(--font-mono); font-weight: 700; color: var(--accent); background: var(--accent-soft);
  padding: 3px 10px; border-radius: 999px; font-size: 14px; font-variant-numeric: tabular-nums; margin-right: 4px; }
.chip { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 2px 10px; font-size: 13px; }
.chip:hover { border-color: var(--accent); }
.chip.next { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.chip:disabled { opacity: .45; cursor: default; }
.tabs { display: flex; gap: 2px; overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 5px 10px; border-radius: 8px; color: var(--muted); white-space: nowrap; flex: none; }
.tabs button.on { background: var(--surface-2); color: var(--fg); font-weight: 700; }
.mtabs { display: none; width: 100%; min-width: 0; flex: 1 1 100%; }

.main { min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 380px; }
.chat { min-height: 0; display: grid; grid-template-rows: minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr); border-right: 1px solid var(--line); }
.log { overflow-y: auto; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px; display: flex; flex-direction: column; gap: 2px; }
.divider { display: flex; align-items: center; gap: 10px; margin: 12px 0 2px; font-size: 12px; font-weight: 700; color: var(--accent); }
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.msg { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; padding: 5px 8px; border-radius: 8px; }
.msg:hover { background: var(--surface-2); }
.msg.pinged { background: color-mix(in srgb, var(--accent) 10%, transparent); box-shadow: inset 3px 0 0 var(--accent); }
.avatar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; color: #fff; }
.who { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; font-size: 14px; }
.who b.bot { color: var(--bot); }
.chan { font-size: 11px; border-radius: 4px; padding: 0 5px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.chan.c1 { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
.who time, .who .tag { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.who .tag { font-family: var(--font-mono); }
.who .act { margin-left: auto; border: 0; background: none; color: var(--muted); font-size: 12px; }
.who .act:hover { color: var(--accent); }
.text { white-space: pre-wrap; overflow-wrap: anywhere; }
.text code { background: var(--surface-2); border: 1px solid var(--line); padding: 0 4px; border-radius: 4px; }
.text .sub { display: block; font-size: 12px; color: var(--muted); }
.mention { background: var(--mention); color: var(--mention-fg); border-radius: 4px; padding: 0 3px; font-weight: 500; }
.replyto { font-size: 12px; color: var(--muted); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.replyto::before { content: "↱ "; }
.card { margin-top: 4px; max-width: 520px; border-left: 4px solid var(--c, var(--accent)); background: var(--surface-2);
  border-radius: 6px; padding: 8px 12px; display: grid; gap: 4px; }
.card .ct { font-weight: 700; }
.card .cd { font-size: 14px; }
.card .cf { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 6px 10px; }
.card .fd { min-width: 0; font-size: 13px; }
.card .fd.wide { grid-column: 1 / -1; }
.card .fn { font-weight: 700; font-size: 12px; }
.card .fv { white-space: pre-wrap; }
.card .ft { font-size: 11px; color: var(--muted); }
.btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.btns button { border: 1px solid var(--line); border-radius: 6px; padding: 2px 12px; font-size: 14px; background: var(--surface-2); }
.btns .btnlink { border: 1px solid var(--line); border-radius: 6px; padding: 2px 12px; font-size: 14px; background: var(--surface-2); color: var(--fg); text-decoration: none; }
.btns button.success { background: var(--ok); color: #fff; border-color: var(--ok); }
.btns button.danger { color: var(--danger); }
.intent { margin-top: 2px; display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.pill { background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 0 8px; font-weight: 700; }
.pill.unknown { background: var(--danger-soft); color: var(--danger); }
.flag { border: 0; background: none; color: var(--muted); font-size: 12px; padding: 0 2px; }
.flag.on { color: var(--danger); font-weight: 700; }

.composer { border-top: 1px solid var(--line); background: var(--surface); display: grid; gap: 6px; grid-template-columns: minmax(0, 1fr);
  padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px; }
.replybar { display: flex; gap: 8px; font-size: 13px; color: var(--muted); background: var(--surface-2); padding: 3px 10px; border-radius: 6px; }
.replybar button { margin-left: auto; border: 0; background: none; color: var(--muted); }
.row { display: flex; gap: 6px; align-items: center; }
.row select { flex: none; max-width: 6em; }
.row textarea { flex: 1; min-width: 0; resize: none; height: 40px; }
.at { display: flex; align-items: center; gap: 3px; font-size: 13px; color: var(--muted); flex: none; }
.primary { border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 8px; padding: 7px 14px; font-weight: 700; }
.ghost { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 5px 10px; }
.ghost:hover { border-color: var(--accent); }
.hint { font-size: 12px; color: var(--muted); }

.side { min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); background: var(--surface); }
.side > .tabs { padding: 8px 12px; border-bottom: 1px solid var(--line); }
.panes { overflow-y: auto; }
.pane { padding: 14px; padding-right: max(14px, env(safe-area-inset-right, 0px)); display: grid; gap: 12px; align-content: start; }
.list { display: grid; gap: 6px; }
.item { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; display: grid; gap: 2px; font-size: 14px; }
.meta { font-size: 12px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
.status { font-size: 11px; font-weight: 700; border-radius: 999px; padding: 0 7px; }
.status.pending { background: var(--accent-soft); color: var(--accent); }
.status.fired { background: var(--danger-soft); color: var(--danger); }
.status.done { background: var(--ok-soft); color: var(--ok); }
.status.cancelled, .status.expired, .status.draft { background: var(--surface-2); color: var(--muted); }
.inline { display: flex; gap: 6px; align-items: center; }
.inline input { flex: 1; min-width: 0; }
.inline select { flex: none; max-width: 6.5em; }
fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 8px; }
legend { font-weight: 700; font-size: 13px; color: var(--accent); padding: 0; margin-bottom: 2px; }
.field { display: grid; gap: 3px; }
.field label { font-size: 12px; color: var(--muted); }
.field input, .field select { width: 100%; }
.check { display: flex; gap: 6px; align-items: center; font-size: 14px; }
.actions { display: flex; gap: 6px; align-items: center; position: sticky; bottom: 0; background: var(--surface); padding-block: 8px; }
.toast { font-size: 13px; color: var(--ok); }
.rule { border-top: 1px solid var(--line); padding: 5px 0; display: grid; gap: 1px; font-size: 13px; }
.rule .kw { color: var(--muted); }
.sec-title { font-size: 13px; font-weight: 700; color: var(--accent); margin-top: 6px; }
.thumbs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.thumbs span { position: relative; }
.reacts { display: flex; gap: 4px; margin-top: 4px; }
.reacts span { font-size: 12px; padding: 1px 8px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--accent); }
.imgcode { display: block; font-size: 11px; color: var(--muted); text-align: center; cursor: pointer; }
.thumbs img { width: 56px; height: 56px; object-fit: cover; border-radius: 6px; display: block; }
.thumbs button { position: absolute; top: -6px; right: -6px; border: 0; border-radius: 50%; width: 18px; height: 18px; padding: 0; font-size: 11px; line-height: 18px; background: var(--surface-2); color: var(--fg); }
.att { display: block; max-width: min(240px, 100%); max-height: 240px; border-radius: 8px; margin-top: 4px; }
.empty { color: var(--muted); font-size: 13px; }

.loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); z-index: 20;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.loading .box { max-width: 420px; display: grid; gap: 10px; text-align: center; }
.loading .bar { height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; }
.loading .bar i { display: block; height: 100%; width: 30%; background: var(--accent); border-radius: 999px; animation: slide 1.2s ease-in-out infinite; }
@keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(340%); } }
@media (prefers-reduced-motion: reduce) { .loading .bar i { animation: none; width: 60%; } }
.loading .err { color: var(--danger); text-align: left; font-size: 13px; white-space: pre-wrap; }

@media (max-width: 860px) {
  .mtabs { display: flex; }
  .main { grid-template-columns: minmax(0, 1fr); }
  .chat { border-right: 0; }
  .side > .tabs { display: none; }
  .main[data-view="chat"] .side { display: none; }
  .main:not([data-view="chat"]) .chat { display: none; }
  .timebar { margin-left: 0; }
  .log, .composer { padding-right: max(16px, env(safe-area-inset-right, 0px)); }
}
</style>

<div class="app">
  <header class="top">
    <div class="brand"><span>#</span> 助理測試台</div>
    <div class="timebar">
      <span class="clock" id="clock">—</span>
      <button class="chip" data-adv="600">+10分</button>
      <button class="chip" data-adv="3600">+1時</button>
      <button class="chip" data-adv="86400">+1天</button>
      <button class="chip next" id="jump" title="跳到下一個提醒">⏭ <span id="nextLabel"></span></button>
    </div>
    <nav class="tabs mtabs" id="mtabs"></nav>
  </header>

  <div class="main" id="main" data-view="chat">
    <section class="chat" aria-label="頻道">
      <div class="log" id="log" aria-live="polite"></div>
      <form class="composer" id="composer">
        <div class="replybar" id="replybar" hidden><span id="replyText"></span><button type="button" id="replyCancel" aria-label="取消回覆">✕</button></div>
        <div class="row">
          <select id="where" aria-label="哪個頻道"></select>
          <select id="who" aria-label="誰說"></select>
          <label class="at"><input type="checkbox" id="atjvs" checked> @jvs</label>
          <textarea id="input" rows="1" placeholder="說點什麼…" aria-label="訊息"></textarea>
          <button class="primary" type="submit">送出</button>
        </div>
        <div class="hint">不勾 @jvs＝一般聊天，句子裡提到「賈維斯」也算叫它・/說明 /設定 /天氣 /提醒 /stark says・@小明 提醒別人</div>
      </form>
    </section>

    <aside class="side">
      <nav class="tabs" id="stabs"></nav>
      <div class="panes">
        <div class="pane" data-pane="rem"><div class="list" id="remList"></div></div>

        <div class="pane" data-pane="notes" hidden>
          <form class="inline" id="noteAdd"><select id="noteAddCat" aria-label="清單"></select><input id="noteAddText" placeholder="新增" aria-label="新增"><button class="ghost">＋</button></form>
          <div class="list" id="noteList"></div>
        </div>

        <div class="pane" data-pane="replies" hidden>
          <div class="tag">一行一句。多行的句子用 " " 包起來；句子後面加 {圖:代碼} 就一定附那張圖，代碼在最下面的圖片底下，按一下複製；加 {圖:無} 就這句不附圖。</div>
          <form id="replyForm" class="list"></form>
          <div class="actions"><button class="primary" type="button" data-save="replies">套用</button><button class="ghost" type="button" data-reset="replies">恢復預設</button><span class="toast" id="repliesToast"></span></div>
          <div class="list" id="imgPane"></div>
        </div>

        <div class="pane" data-pane="rules" hidden>
          <div class="tag">每則訊息照順序比對，第一條符合的生效。回覆和圖片可以只放一種。</div>
          <span class="toast" id="rulesToast"></span>
          <div class="list" id="ruleList"></div>
        </div>

        <div class="pane" data-pane="logic" hidden>
          <form class="inline" id="tryForm"><input id="tryText" placeholder="試一句" aria-label="試一句"><button class="ghost">看判斷</button></form>
          <div class="intent" id="tryResult"></div>
          <div id="logicBody"></div>
        </div>

        <div class="pane" data-pane="settings" hidden>
          <div class="item"><b style="font-size:13px">假預報（測試天氣變化通知）</b>
            <div class="inline"><span class="hint">今天</span><select id="rainHour" aria-label="幾點開始下雨"></select><button class="ghost" id="rainSet" type="button">套用</button></div>
            <div class="hint" id="rainNow"></div></div>
          <form id="settingsForm" class="list"></form>
          <div class="actions"><button class="primary" type="button" data-save="settings">套用</button><button class="ghost" type="button" data-reset="settings">恢復預設</button><span class="toast" id="settingsToast"></span></div>
        </div>

        <div class="pane" data-pane="batch" hidden>
          <div class="inline"><input type="datetime-local" id="batchStart" value="2026-10-29T18:00" aria-label="起始時間"><button class="primary" id="batchRun" type="button">清空並送出</button></div>
          <textarea id="batchText" rows="14" aria-label="批次句子"></textarea>
          <div class="hint"><code># 標題</code> <code>12. 編號</code> <code>⏩ 30分鐘</code> <code>~ 不@</code> <code>[小明] 換人</code> <code>↩關鍵字：回覆</code> <code>【閒聊】換頻道</code> <code>☔ 21 假預報</code> <code>/說明</code></div>
          <div class="sec-title">判斷錯的句子</div>
          <div class="list" id="flagList"></div>
          <textarea id="reportText" rows="5" readonly aria-label="回報內容"></textarea>
          <div class="inline"><button class="ghost" id="copyReport" type="button">複製給 Claude</button><span class="toast" id="copyToast"></span></div>
        </div>
      </div>
    </aside>
  </div>
</div>

<div class="loading" id="loading">
  <div class="box">
    <b>啟動中…</b>
    <div class="bar"><i></i></div>
    <div class="hint" id="loadStep">載入 Python（約 14MB）</div>
    <div class="err" id="loadErr" hidden></div>
  </div>
</div>

<script type="application/json" id="preset">/*__PRESET__*/</script>
<script type="application/json" id="pysrc">/*__PYSRC__*/</script>
<script src="pyodide/python_stdlib.js"></script>
<script src="pyodide/pyodide.js"></script>
<script>
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const COLORS = { 1: "#c76a12", 2: "#2f8f6b", 3: "#a14fbf", 1000: "#3d55c9" };
const TABS = [["rem", "提醒"], ["notes", "清單"], ["replies", "回覆"], ["rules", "規則"], ["logic", "判斷"], ["settings", "設定"], ["batch", "批次"]];
const STATUS = { pending: "等待", fired: "響了", done: "完成", cancelled: "取消", expired: "過期", draft: "問時間" };
const PRESET = JSON.parse(document.getElementById("preset").textContent);
let sim, info, state, me = 1, replyTo = null, pane = "rem";
const flags = new Map();   // 訊息 id → {tag, said, got, expect}

const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nameOf = id => +id === 1000 ? "jvs" : (info.members.find(m => m.id === +id) || {}).name || id;
const plain = t => t.replace(/^<@1000>\s*/, "").replace(/<@&?(\d+)>/g, (_, i) => "@" + nameOf(i)).replace(/\n/g, " ");

function render(text) {
  // Discord 風格 markdown（bot 會用到的幾種）
  let h = esc(text);
  h = h.replace(/&lt;@&amp;(\d+)&gt;/g, (_, id) => `<span class="mention">@${esc((info.roles.find(r => r.id === +id) || {}).name || id)}</span>`);
  h = h.replace(/&lt;#(\d+)&gt;/g, (_, id) => `<span class="mention">#${esc((info.channels.find(c => c.id === +id) || {}).name || id)}</span>`);
  h = h.replace(/&lt;@!?(\d+)&gt;/g, (_, id) => `<span class="mention">@${esc(nameOf(id))}</span>`);
  h = h.replace(/~~([\s\S]+?)~~/g, "<s>$1</s>").replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/__(.+?)__/g, "<u>$1</u>")
       .replace(/`([^`]+)`/g, "<code>$1</code>");
  const lines = h.split("\n");
  return lines.map((l, i) => {
    const sub = l.startsWith("-# "), prevSub = i > 0 && lines[i - 1].startsWith("-# ");
    return (i === 0 || sub || prevSub ? "" : "\n") + (sub ? `<span class="sub">${l.slice(3)}</span>` : l);
  }).join("");
}

function call(method, ...args) { state = JSON.parse(sim[method](...args)); draw(); }

function draw() {
  $("#clock").textContent = state.now_label;
  $("#nextLabel").textContent = state.next_event ? state.next_event.replace(/^\d+\/\d+/, m => m) : "";
  $("#jump").disabled = !state.next_event;
  drawLog(); drawReminders(); drawNotes(); drawFlags();
}

function drawLog() {
  const log = $("#log");
  const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 80;
  const myRoles = info.members.find(x => x.id === me).roles;
  const pingRe = new RegExp(`<@${me}>` + (myRoles.length ? `|<@&(${myRoles.join("|")})>` : ""));
  let lastDate = null, html = "";
  for (const m of state.messages) {
    if (m.ephemeral_for && m.ephemeral_for !== me) continue;
    if (m.author === 0) { html += `<div class="divider">${esc(m.text)}</div>`; continue; }
    if (m.date !== lastDate) { html += `<div class="divider" style="color:var(--muted);font-weight:500">${esc(m.date)}</div>`; lastDate = m.date; }
    const isBot = m.author === 1000;
    const ref = m.reply_to && state.messages.find(x => x.id === m.reply_to);
    const btns = m.buttons.length ? `<div class="btns">${m.buttons.map(b => b.url
      ? `<a class="btnlink" href="${esc(b.url)}" target="_blank" rel="noopener">${esc(b.label)} ↗</a>`
      : `<button class="${b.style}" data-press="${esc(b.custom_id)}" data-mid="${m.id}">${esc(b.label)}</button>`).join("")}</div>` : "";
    const intent = m.intent ? `<div class="intent"><span class="pill ${m.intent.kind === "unknown" ? "unknown" : ""}">${esc(m.intent.label)}</span>
      <span>${esc(m.intent.detail)}</span><button class="flag ${flags.has(m.id) ? "on" : ""}" data-flag="${m.id}" title="判斷錯了">${flags.has(m.id) ? "✗ 已標記" : "✗"}</button></div>` : "";
    html += `<article class="msg ${m.ping && pingRe.test(m.text) ? "pinged" : ""}">
      <div class="avatar" style="background:${COLORS[m.author] || "#777"}" aria-hidden="true">${esc(String(nameOf(m.author)).slice(0, 1).toUpperCase())}</div>
      <div style="min-width:0">${ref ? `<div class="replyto">${esc(nameOf(ref.author))}：${esc(plain(ref.text).slice(0, 50))}</div>` : ""}
        <div class="who"><b class="${isBot ? "bot" : ""}">${esc(nameOf(m.author))}</b><span class="chan c${m.channel}">#${esc((info.channels.find(c => c.id === m.channel) || {}).name || "")}</span><time>${esc(m.time)}</time>${m.tag ? `<span class="tag">${esc(m.tag)}</span>` : ""}${m.ephemeral_for ? '<span class="tag">只有你看得到</span>' : ""}
          ${isBot && !m.ephemeral_for ? `<button class="act" data-reply="${m.id}">回覆</button>` : ""}</div>
        ${m.text ? `<div class="text">${render(isBot ? m.text : m.text.replace(/^<@1000>\s*/, ""))}</div>` : ""}${m.embed ? card(m.embed) : ""}${m.image ? attachment(m.image) : ""}${m.reactions ? `<div class="reacts">${m.reactions.map(r => `<span>${esc(r)} 1</span>`).join("")}</div>` : ""}${btns}${intent}
      </div></article>`;
  }
  log.innerHTML = html || `<div class="empty">還沒有訊息</div>`;
  if (atBottom) log.scrollTop = log.scrollHeight;
}

function card(e) {
  // Discord 的 embed：左邊色條、標題、說明、欄位（inline 的排成一列）、頁尾
  const color = e.color != null ? "#" + e.color.toString(16).padStart(6, "0") : "";
  return `<div class="card" style="${color ? `--c:${color}` : ""}"><div class="ct">${esc(e.title || "")}</div>
    ${e.description ? `<div class="cd">${render(e.description)}</div>` : ""}
    <div class="cf">${(e.fields || []).map(f => `<div class="fd ${f.inline ? "" : "wide"}"><div class="fn">${esc(f.name)}</div><div class="fv">${render(f.value)}</div></div>`).join("")}</div>
    ${e.footer ? `<div class="ft">${esc(e.footer)}</div>` : ""}</div>`;
}

function drawNotes() {

function drawForm(el, groups) {
  const s = state.settings;
  el.innerHTML = groups.map(([title, keys]) => `<fieldset><legend>${esc(title)}</legend>${keys.map(k => {
    const v = s[k], d = info.defaults[k], label = esc(info.labels[k] || k);

    e.preventDefault();

  $("#log").addEventListener("click", e => {

    if (r) startReply(+r.dataset.reply);
    if (f) {
      const id = +f.dataset.flag, m = state.messages.find(x => x.id === id);
      if (flags.has(id)) flags.delete(id);
      else flags.set(id, { tag: m.tag || "", said: plain(m.text), got: `${m.intent.label}｜${m.intent.detail}`, expect: "" });
      drawLog(); drawFlags();

  for (const b of $$("[data-adv]")) b.addEventListener("click", () => call("advance", +b.dataset.adv));
  $("#jump").addEventListener("click", () => call("jump_next"));

  $("#remList").addEventListener("click", e => {
    const row = e.target.closest("[data-rem]"); if (!row) return;
    if (e.target.matches("[data-rem-save]")) call("rem_edit", me, +row.dataset.rem, $("[data-f=when]", row).value, $("[data-f=text]", row).value);
    if (e.target.matches("[data-rem-del]")) call("rem_cancel", me, +row.dataset.rem);
  });
  $("#noteList").addEventListener("click", e => {
    const row = e.target.closest("[data-note]"); if (!row) return;

    if (e.target.matches("[data-note-save]")) call("note_update", +row.dataset.note, $("select", row).value, $("input", row).value);

  $("#noteAdd").addEventListener("submit", e => { e.preventDefault(); call("note_add", $("#noteAddCat").value, $("#noteAddText").value); $("#noteAddText").value = ""; });

  document.addEventListener("change", e => {
    const g = e.target.dataset && e.target.dataset.img; if (!g) return;
    IMG_NAMES[g] = IMG_NAMES[g] || [];
    [...e.target.files].forEach((f, i) => { const n = `${Date.now()}${i}-${f.name}`; IMG_URLS[n] = URL.createObjectURL(f); IMG_NAMES[g].push(n); });
    syncImages(); drawImages(); drawRules(); draw();
  });
  document.addEventListener("click", e => {
    if (e.target.matches && e.target.matches(".imgcode")) { navigator.clipboard && navigator.clipboard.writeText(e.target.textContent).catch(() => {}); e.target.style.color = "var(--accent)"; return; }
    const g = e.target.dataset && e.target.dataset.imgDel; if (!g) return;

  });
  for (const b of $$("[data-save]")) b.addEventListener("click", () => {

  });
  for (const b of $$("[data-reset]")) b.addEventListener("click", () => {
    const pg = b.dataset.reset; call("reset_settings", pg); drawForms(); $(`#${pg}Toast`).textContent = state.note; drawLogic();

function drawRules() {

function ruleAction(fn, ...args) { call(fn, ...args); $("#rulesToast").textContent = state.note || ""; drawRules(); }
function drawForms() { drawForm($("#replyForm"), info.reply_groups); drawForm($("#settingsForm"), info.groups); }

function runBatch(text, startLocal) {
  flags.clear();
  state = JSON.parse(sim.restart(startLocal ? new Date(startLocal + ":00+08:00").getTime() : Date.now()));
  syncImages();
  for (const raw of text.split("\n")) {
    const line = raw.trim();
    if (!line || /^#\s*=+\s*$/.test(line)) continue;
    if (line.startsWith("#")) { state = JSON.parse(sim.divider(line.replace(/^#+\s*/, ""))); continue; }
    const rain = line.match(/^☔\s*(\d+|不下雨)/);
    if (rain) {
      state = JSON.parse(sim.set_rain(rain[1] === "不下雨" ? -1 : +rain[1]));
      state = JSON.parse(sim.divider(rain[1] === "不下雨" ? "☔ 假預報：不下雨" : `☔ 假預報：${rain[1]} 點開始下雨`));
      continue;
    }
    const ff = line.match(/^⏩\s*(\d+)\s*(分鐘|分|小時|天)?/);
    if (ff) {
      state = JSON.parse(sim.divider(`⏩ ${ff[1]} ${ff[2] || "分鐘"}`));
      state = JSON.parse(sim.advance(+ff[1] * ({ "小時": 3600, "天": 86400 }[ff[2]] || 60)));
      continue;
    }
    let rest = line, who = 1, tag = "", mentioned = true, reply = null, chan = 1, mm;
    if ((mm = rest.match(/^(\d+)[.、)]\s*(.+)$/))) { tag = "#" + mm[1]; rest = mm[2]; }
    if ((mm = rest.match(/^【(.+?)】\s*(.+)$/))) { const c = info.channels.find(x => x.name === mm[1]); if (c) chan = c.id; rest = mm[2]; }
    if ((mm = rest.match(/^\[(.+?)\]\s*(.+)$/))) { const u = info.members.find(x => x.name === mm[1]); if (u) who = u.id; rest = mm[2]; }
    if ((mm = rest.match(/^↩\s*([^：:]*)[：:]\s*(.+)$/))) {
      // 回覆最近一則含關鍵字的 bot 訊息（沒寫關鍵字＝最近一則有按鈕的）
      const key = mm[1].trim();
      const said = m => { const r = m.reply_to && state.messages.find(x => x.id === m.reply_to); return m.text + (r ? r.text : ""); };
      const target = [...state.messages].reverse().find(m => m.author === 1000 && !m.ephemeral_for && (key ? said(m).includes(key) : m.buttons.length));
      reply = target ? target.id : null; mentioned = false; rest = mm[2];
    }
    if (rest.startsWith("~")) { mentioned = false; rest = rest.slice(1).trim(); }
    const sl = rest.match(/^\/(說明|設定|天氣|提醒|stark says)\s*(.*)$/i);
    if (sl) { state = JSON.parse(sim.slash(who, sl[1], sl[2], chan)); continue; }
    state = JSON.parse(sim.say(who, rest, reply, tag, mentioned, chan));
  }
  draw();
  $("#log").scrollTop = 0;
}

async function boot() {
  try {
    const py = await loadPyodide({ indexURL: new URL("pyodide/", location.href).href });
    $("#loadStep").textContent = "載入 jvs…";
    for (const [path, code] of Object.entries(JSON.parse($("#pysrc").textContent))) {
      const dir = path.split("/").slice(0, -1).join("/");
      if (dir) py.FS.mkdirTree("/home/pyodide/" + dir);
      py.FS.writeFile("/home/pyodide/" + path, code);
    }
    py.runPython("import sys; sys.path.insert(0, '/home/pyodide')");
    sim = py.pyimport("simbridge").Sim(Date.now());
    info = JSON.parse(sim.info());
    wire();
    state = JSON.parse(sim.state());
    drawForms(); drawImages(); drawRules(); drawLogic(); setPane("rem"); setView("chat"); drawRain();
    runBatch(PRESET, "2026-10-29T18:00");
    $("#loading").hidden = true;
  } catch (err) {
    $("#loadErr").hidden = false;
    $("#loadErr").textContent = "啟動失敗：" + (err && err.message || err);
    $(".loading .bar").hidden = true;
  }
}

// 標準函式庫包在 python_stdlib.js；Pyodide 要下載 python_stdlib.zip 時直接給它（網頁空間不能放 .zip）
const realFetch = window.fetch.bind(window);
window.fetch = (input, init) => {
  const url = typeof input === "string" ? input : (input && (input.url || input.href)) || String(input);
  if (url && url.endsWith("python_stdlib.zip") && self.PY_STDLIB_B64) {
    const bin = atob(self.PY_STDLIB_B64), bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return Promise.resolve(new Response(bytes, { headers: { "Content-Type": "application/zip" } }));
  }
  return realFetch(input, init);
};
if (typeof loadPyodide === "function") boot();
else { $("#loadErr").hidden = false; $("#loadErr").textContent = "pyodide.js 沒有載入"; }
</script>
